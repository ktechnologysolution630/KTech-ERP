<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap">
<style>

/* Layout: one long field guide. A navy blueprint band states the main document route, a sticky role bar
   filters every step to "what I do", then each sidebar menu group gets its own section of numbered stations. */
:root {
  --bg: #f2f5fb;
  --surface: #ffffff;
  --surface-2: #e9eef8;
  --ink: #0e1a38;
  --muted: #54617f;
  --line: #d4dcec;
  --line-strong: #a9b6d1;
  --brand: #2453d4;
  --brand-ink: #ffffff;
  --band: #102d72;
  --band-ink: #ffffff;
  --band-muted: #b9c8ee;
  --band-grid: rgba(255, 255, 255, 0.07);
  --ok: #12805a;
  --wait: #a35f00;
  --bad: #c0362f;
  --r-site: #0b7f6a;
  --r-pm: #7442c2;
  --r-pur: #2453d4;
  --r-fin: #a85a00;
  --r-exec: #b02a66;
  --r-admin: #4a5468;
  --font-display: "Bai Jamjuree", "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1121; --surface: #111a2f; --surface-2: #18233d; --ink: #e5ebf8; --muted: #9ba9c8;
    --line: #25324e; --line-strong: #3d4d72; --brand: #7795f3; --brand-ink: #0a1121;
    --band: #0f2257; --band-ink: #ffffff; --band-muted: #a9bbea; --band-grid: rgba(255, 255, 255, 0.06);
    --ok: #3dc18f; --wait: #e5a54a; --bad: #f07a72;
    --r-site: #39c3a4; --r-pm: #ae8af0; --r-pur: #7c9cf6; --r-fin: #e3a157; --r-exec: #ee77aa; --r-admin: #a3adc2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1121; --surface: #111a2f; --surface-2: #18233d; --ink: #e5ebf8; --muted: #9ba9c8;
  --line: #25324e; --line-strong: #3d4d72; --brand: #7795f3; --brand-ink: #0a1121;
  --band: #0f2257; --band-ink: #ffffff; --band-muted: #a9bbea; --band-grid: rgba(255, 255, 255, 0.06);
  --ok: #3dc18f; --wait: #e5a54a; --bad: #f07a72;
  --r-site: #39c3a4; --r-pm: #ae8af0; --r-pur: #7c9cf6; --r-fin: #e3a157; --r-exec: #ee77aa; --r-admin: #a3adc2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.3; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--brand); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }


/* Apple-style product page: black stage, huge type, generous space. A sticky segmented control picks the work line;
   the line's steps run as a horizontal track pinned while you scroll (GSAP ScrollTrigger), a bento grid explains the hubs,
   and tapping a step opens a sheet with the full how-to. Dark on purpose, like Apple's pro pages. */
:root, :root[data-theme="light"], :root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --ink: #f5f5f7; --muted: #a1a1a6; --faint: #6e6e73;
  --line: #38383a; --line-strong: #48484a; --brand: #2997ff; --brand-ink: #000; --ok: #30d158; --wait: #ff9f0a; --bad: #ff453a;
  --r-site: #64d2ff; --r-pm: #bf5af2; --r-pur: #0a84ff; --r-fin: #ff9f0a; --r-exec: #ff375f; --r-admin: #98989d;
  --font-display: -apple-system, "SF Pro Display", "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
  --font-body: -apple-system, "SF Pro Text", "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #a1a1a6; color-scheme: dark; } }
html { scroll-behavior: auto; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
.gut { padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1080px; margin: 0 auto; }

/* hero */
.hero { min-height: 82vh; display: grid; align-content: center; padding-block: 90px 60px; text-align: center; overflow: hidden; position: relative; }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 62%, rgba(41, 151, 255, .22), transparent 70%); pointer-events: none; }
.eyebrow { font-size: 17px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
.hero h1 { font-family: var(--font-display); font-size: clamp(44px, 9vw, 96px); font-weight: 700; letter-spacing: -.02em; line-height: 1.08; margin: 12px 0 0;
  background: linear-gradient(180deg, #fff 30%, #a1a1a6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { font-size: clamp(19px, 2.4vw, 24px); color: var(--muted); max-width: 34em; margin: 22px auto 0; line-height: 1.5; font-weight: 400; }
.hero .chev { margin-top: 44px; font-size: 14px; color: var(--faint); }
.hero .chev span { display: block; font-size: 22px; margin-top: 4px; }

/* segmented control */
.segbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; padding-block: 12px; background: rgba(0, 0, 0, .72);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(255, 255, 255, .08); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: #000; }
.seg { display: flex; gap: 4px; margin: 0 auto; width: max-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 4px; border-radius: 999px; background: #1c1c1e; position: relative; }
.seg::-webkit-scrollbar { display: none; }
.seg .pill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: #f5f5f7; z-index: 0; }
.seg button { position: relative; z-index: 1; font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; border: 0; background: transparent; color: #d2d2d7; padding: 8px 16px; border-radius: 999px; transition: color .3s; }
.seg button[aria-pressed="true"] { color: #000; }

/* line intro */
.intro { padding-block: 110px 40px; text-align: center; }
.intro .eyebrow { color: var(--accent, #2997ff); }
.intro h2 { font-family: var(--font-display); font-size: clamp(36px, 6.4vw, 72px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 10px 0 0; }
.intro h2 .nw { white-space: nowrap; }
.intro p { font-size: clamp(18px, 2vw, 21px); color: var(--muted); max-width: 36em; margin: 18px auto 0; line-height: 1.55; }
.roles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 30px; }
.roles { max-width: 860px; margin-left: auto; margin-right: auto; }
.roles button { font: inherit; font-size: 14px; cursor: pointer; padding: 7px 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: #d2d2d7; transition: background .25s, color .25s, border-color .25s; }
.roles button:hover { border-color: #86868b; }
.roles button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #000; font-weight: 600; }
.rolenote { margin-top: 12px; font-size: 14px; color: var(--faint); min-height: 1.5em; }

/* pinned horizontal track */
.trackwrap { position: relative; overflow: hidden; padding-block: 30px 70px; }
.progress { position: relative; height: 3px; border-radius: 3px; background: #1c1c1e; margin: 0 auto 34px; max-width: 1080px; overflow: hidden; }
.progress i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, #2997ff, #bf5af2, #ff375f); }
.track { display: flex; gap: 22px; width: max-content; padding-left: max(22px, calc((100vw - 1080px) / 2)); padding-right: 22vw; will-change: transform; }
.step { --g: #2997ff; position: relative; flex: none; width: 320px; min-height: 430px; border-radius: 28px; padding: 30px 28px 28px; background: #1c1c1e; display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 14px;
  cursor: pointer; text-align: left; font: inherit; color: inherit; border: 0; transition: opacity .35s, filter .35s; overflow: hidden; }
.step::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
.step .glow { position: absolute; inset: auto -30% -40% -30%; height: 70%; background: radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--g) 38%, transparent), transparent 70%); opacity: .55; pointer-events: none; }
.step .no { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--g); letter-spacing: .02em; }
.step .ic { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: color-mix(in srgb, var(--g) 16%, #2c2c2e); }
.step .ic svg { width: 36px; height: 36px; }
.step h3 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.step .who { font-size: 14px; color: var(--muted); margin-top: -6px; }
.step ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; align-self: end; position: relative; }
.step li { font-size: 15px; line-height: 1.45; color: #d2d2d7; display: flex; gap: 10px; }
.step li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: .6em; border-radius: 50%; background: var(--g); }
.step .more { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); position: relative; padding-top: 6px; }
.step .more b { width: 34px; height: 34px; border-radius: 50%; background: #3a3a3c; color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 400; transition: transform .3s, background .3s; }
.step:hover .more b { background: #f5f5f7; color: #000; transform: rotate(90deg); }
.step:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; }
.step.dim { opacity: .28; filter: grayscale(.6); }
.step .mine { position: absolute; top: 26px; right: 24px; font-size: 12px; font-weight: 600; color: #000; background: var(--g); padding: 2px 10px; border-radius: 999px; }
.step .tagap { position: absolute; top: 26px; right: 24px; font-size: 12px; color: var(--muted); border: 1px solid var(--line-strong); padding: 1px 9px; border-radius: 999px; }
.step .mine ~ .tagap { display: none; }

/* bento */
.bento { padding-block: 30px 120px; }
.bento h2 { font-family: var(--font-display); font-size: clamp(30px, 4.6vw, 48px); font-weight: 700; letter-spacing: -.015em; text-align: center; margin-bottom: 36px; }
.bgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; }
.tile { border-radius: 28px; background: #1c1c1e; padding: 30px; display: grid; gap: 12px; align-content: start; min-width: 0; position: relative; overflow: hidden; }
.tile .k { font-size: 14px; font-weight: 600; color: var(--muted); }
.tile h3 { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.tile p { font-size: 16px; color: var(--muted); line-height: 1.55; }
.t-master { grid-column: span 4; background: linear-gradient(135deg, #0b2a52, #1c1c1e 60%); }
.t-master .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.t-master .links button { font: inherit; font-size: 14px; cursor: pointer; border: 0; border-radius: 999px; padding: 6px 14px; background: rgba(255, 255, 255, .1); color: #fff; }
.t-master .links button:hover { background: rgba(255, 255, 255, .2); }
.t-docs { grid-column: span 2; }
.t-docs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.t-docs li { font-size: 15px; line-height: 1.45; padding-bottom: 10px; border-bottom: 1px solid #2c2c2e; }
.t-docs li:last-child { border-bottom: 0; padding-bottom: 0; }
.t-loop { grid-column: span 2; background: linear-gradient(160deg, #2a1347, #1c1c1e 65%); }
.t-loop svg { width: 44px; height: 44px; }
.t-tools { grid-column: span 4; }
.t-tools .tg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.t-tools .tg div { border-radius: 16px; background: #2c2c2e; padding: 14px; display: grid; gap: 4px; font-size: 15px; font-weight: 600; line-height: 1.35; }
.t-tools .tg small { font-size: 13px; font-weight: 400; color: var(--muted); }
.t-tools svg { width: 22px; height: 22px; margin-bottom: 4px; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; justify-items: center; }
.sheet .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.sheet .panel { position: relative; width: min(760px, 100%); max-height: min(86vh, 900px); overflow: auto; background: #1c1c1e; border-radius: 28px 28px 0 0;
  padding: 18px max(22px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #48484a; margin: 0 auto; }
.sheet .stop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet .stop span { font-size: 14px; color: var(--muted); }
.sheet .stop .acts { display: flex; gap: 8px; }
.sheet .stop button { font: inherit; font-size: 14px; cursor: pointer; border: 0; border-radius: 999px; padding: 7px 14px; background: #2c2c2e; color: #f5f5f7; }
.sheet .stop button:disabled { opacity: .35; cursor: default; }
.sheet .stop button.x { width: 34px; height: 34px; padding: 0; font-size: 18px; }
.sheet .card { border: 0; padding: 0; background: transparent; gap: 12px; }
.sheet .card h3 { font-size: 28px; font-weight: 700; color: #fff; }
.sheet .card .do { font-size: 16px; }

footer.end { padding-block: 0 80px; text-align: center; color: var(--faint); font-size: 13px; }

@media (max-width: 899px) {
  .track { flex-direction: column; width: auto; padding: 0 max(22px, env(safe-area-inset-left, 0px)) 0 max(22px, env(safe-area-inset-right, 0px)); }
  .step { width: 100%; min-height: 0; }
  .progress { display: none; }
  .bgrid { grid-template-columns: minmax(0, 1fr); }
  .tile { grid-column: auto !important; padding: 24px; }
  .t-tools .tg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .intro { padding-block: 70px 30px; }
  .hero { min-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { .step, .seg button, .roles button { transition: none; } }
</style>

<header class="hero gut">
  <div class="inner">
    <div class="eyebrow hx">K Tec ERP · คู่มือการใช้งาน</div>
    <h1 class="hx">ทุกขั้นตอน<br>เห็นในภาพเดียว</h1>
    <p class="hx">เลือกสายงาน เลื่อนดูทีละขั้น แล้วแตะการ์ดเพื่อดูว่าต้องกดตรงไหน ทำอะไร และใครเป็นคนทำ</p>
    <div class="chev hx">เลื่อนลงเพื่อเริ่ม<span>⌄</span></div>
  </div>
</header>

<div class="segbar gut"><div class="seg" id="seg" role="group" aria-label="เลือกสายงาน"><span class="pill" id="pill"></span></div></div>

<main>
  <section class="intro gut">
    <div class="inner">
      <div class="eyebrow" id="l-code"></div>
      <h2 id="l-title"></h2>
      <p id="l-text"></p>
      <div class="roles" id="roles" role="group" aria-label="ดูในมุมของตำแหน่ง">
        <button type="button" data-r="FOREMAN" style="--c:var(--r-site)">โฟร์แมน</button><button type="button" data-r="ENGINEER" style="--c:var(--r-site)">วิศวกร</button><button type="button" data-r="ARCHITECT" style="--c:var(--r-site)">สถาปนิกโครงการ</button><button type="button" data-r="PROJECT_CLERK" style="--c:var(--r-site)">ธุรการโครงการ</button><button type="button" data-r="PM" style="--c:var(--r-pm)">ผู้จัดการโครงการ (PM)</button><button type="button" data-r="PURCHASING" style="--c:var(--r-pur)">จัดซื้อ</button><button type="button" data-r="PURCHASING_HEAD" style="--c:var(--r-pur)">หัวหน้าจัดซื้อ</button><button type="button" data-r="FINANCE" style="--c:var(--r-fin)">การเงิน/บัญชี</button><button type="button" data-r="GENERAL_MANAGER" style="--c:var(--r-exec)">ผู้จัดการทั่วไป</button><button type="button" data-r="OWNER" style="--c:var(--r-exec)">เจ้าของ</button><button type="button" data-r="ADMIN" style="--c:var(--r-admin)">ผู้ดูแลระบบ</button>
      </div>

  <section class="trackwrap" id="trackwrap">

    <div class="inner">
      <h2 class="bx">รอบ ๆ สายงานนี้</h2>

        <div class="tile t-master bx"><span class="k">ศูนย์กลาง</span><h3 id="m-title"></h3><p id="m-text"></p><div class="links" id="m-links"></div></div>
        <div class="tile t-docs bx"><span class="k">เอกสารในสายนี้</span><ul id="docs"></ul></div>

        <div class="tile t-tools bx"><span class="k">เมนูที่ใช้ในสายนี้</span><div class="tg" id="tools"></div></div>
      </div>
    </div>
  </section>
  <footer class="end gut">คู่มือ K Tec ERP · เขียนจากมุมผู้ใช้ กดตรงไหน ทำอะไรได้</footer>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="วิธีทำ"></div>
</div>

<script src="gsap.min.js"></script>
<script src="ScrollTrigger.min.js"></script>
<script>
// How-to cards copied from docs/ktec-usage-guide.html by scripts/build-pipeline-guide.mjs, keyed by each card's heading
var CARDS = {"เข้าสู่ระบบ":"<div class=\"card\">\n        <h3>เข้าสู่ระบบ<\/h3>\n        <ul class=\"do\">\n          <li>กรอกอีเมลและรหัสผ่านที่ผู้ดูแลระบบให้มา แล้วกด <b class=\"btn\">เข้าสู่ระบบด้วยรหัสผ่าน<\/b><\/li>\n          <li>คนที่เปิดเมนูสต็อกไว้จะเข้าหน้า <b>ภาพรวมสต็อก<\/b> คนอื่นจะเข้า <b>พอร์ทัลของฉัน<\/b> ซึ่งมีข่าวบริษัท โครงการของฉัน และกล่องงานของฉัน<\/li>\n          <li>ออกจากระบบได้ที่มุมขวาบน<\/li>\n        <\/ul>\n      <\/div>","ตั้งลายเซ็นของตัวเอง":"<div class=\"card\">\n        <h3>ตั้งลายเซ็นของตัวเอง<\/h3>\n        <ul class=\"do\">\n          <li>คลิกรูปโปรไฟล์มุมขวาบน (โปรไฟล์ / ลายเซ็น) แล้ววาดด้วยนิ้ว ปากกา หรือเมาส์ หรือกด <b class=\"btn\">อัปโหลดรูป<\/b> ลายเซ็นบนกระดาษ ระบบจะลบพื้นหลังให้<\/li>\n          <li>กด <b class=\"btn\">บันทึกลายเซ็น<\/b><\/li>\n          <li>เมื่อคุณส่งหรืออนุมัติเอกสาร ลายเซ็นจะลงใน PR, PO, PV, PRV และเอกสารขายให้อัตโนมัติ ถ้ายังไม่ตั้ง เอกสารจะพิมพ์แค่ชื่อกับวันที่ และไม่มีใครเซ็นแทนใครได้<\/li>\n        <\/ul>\n      <\/div>","ดูว่ามีงานอะไรรอคุณ":"<div class=\"card\">\n        <h3>ดูว่ามีงานอะไรรอคุณ<\/h3>\n        <ul class=\"do\">\n          <li><b>กระดิ่ง<\/b>มุมขวาบน: ตัวเลขสีแดงคือรายการที่ยังไม่อ่าน แยกหมวด งบ BOQ / ใบสั่งซื้อ / ใบขอซื้อ / รับของ/สต็อก / การเงิน / โครงการ / การใช้รถ / ทั่วไป ระบบอัปเดตทุก 60 วินาที<\/li>\n          <li><b>พอร์ทัลของฉัน › กล่องงานของฉัน<\/b>: รวมใบขอซื้อรออนุมัติ ใบสั่งซื้อรออนุมัติ รอรับของ PV รออนุมัติ/รอโอนจ่าย และเอกสารของคุณที่ถูกตีกลับ<\/li>\n          <li>แจ้งเตือนอยู่ในระบบเท่านั้น ไม่มีการส่งอีเมลหรือ LINE<\/li>\n        <\/ul>\n      <\/div>","อนุมัติเอกสารที่ K Tec Approve":"<div class=\"card\">\n        <h3>อนุมัติเอกสารที่ K Tec Approve<\/h3>\n        <div class=\"meta\"><span class=\"who pm\">PM<\/span><span class=\"who pur\">หัวหน้าจัดซื้อ<\/span><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">ผจก.ทั่วไป<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><\/div>\n        <ul class=\"do\">\n          <li>เมนู <b>K Tec Approve<\/b> รวมเอกสารทุกประเภทที่รอการตัดสินใจของคุณไว้ในที่เดียว จัดกลุ่มตามโครงการ ตัวเลขบนเมนูคือจำนวนที่รอ<\/li>\n          <li>กด <b class=\"btn\">อนุมัติ<\/b> หรือ <b class=\"btn\">ตีกลับ<\/b> ถ้าตีกลับต้องใส่เหตุผล แล้วกด <b class=\"btn\">ยืนยันตีกลับ<\/b><\/li>\n          <li>ดูตารางว่าใครอนุมัติเอกสารไหนได้ที่หัวข้อ <a href=\"#approvals\">ใครอนุมัติอะไร<\/a><\/li>\n        <\/ul>\n      <\/div>","ทุกหน้าเอกสารมีเครื่องมือเดียวกัน":"<div class=\"card\">\n        <h3>ทุกหน้าเอกสารมีเครื่องมือเดียวกัน<\/h3>\n        <ul class=\"do\">\n          <li><b class=\"btn\">+ แนบไฟล์/รูป<\/b> สำหรับไฟล์แนบ, ช่องความคิดเห็นพร้อมปุ่ม <b class=\"btn\">ส่ง<\/b>, และประวัติการดำเนินการว่าใครทำอะไรเมื่อไร<\/li>\n          <li><b class=\"btn\">พิมพ์ PDF<\/b> มีใน PR, PO, ใบสำคัญจ่าย (PV) และ 50 ทวิ พิมพ์บนแบบฟอร์ม K TECH พร้อมลายเซ็น<\/li>\n        <\/ul>\n      <\/div>","ค้นหาและตรวจจับประเภทสินค้าอัตโนมัติ":"<div class=\"card\">\n        <h3>ค้นหาและตรวจจับประเภทสินค้าอัตโนมัติ<\/h3>\n        <ul class=\"do\">\n          <li><b>ช่องค้นหาทุกช่อง<\/b> พิมพ์แล้วรอครู่เดียว รายการจะกรองให้เอง ไม่ต้องกด Enter หรือปุ่มแสดง เปลี่ยนวันที่ เดือน หรือตัวเลือกก็แสดงผลทันที<\/li>\n          <li><b>ช่องเลือกโครงการ ผู้ขาย ลูกค้า สินค้า บัญชี<\/b> คลิกแล้วพิมพ์ชื่อหรือรหัสบางส่วน เลือกด้วยลูกศรขึ้นลงแล้วกด Enter หรือคลิก กด Esc เพื่อปิด<\/li>\n          <li><b>พิมพ์ชื่อสินค้าแล้วระบบบอกประเภทให้<\/b> ในใบขอซื้อ (PR) ทะเบียนสินค้า และเพิ่มวัสดุในสต็อก พิมพ์ เช่น “สังกะสีลอนเล็ก” ช่องหมวดและกลุ่มจะเลือก <b>งานสถาปัตยกรรม › งานหลังคา<\/b> ให้เอง พร้อมข้อความสีเขียว “ระบบตรวจพบประเภท”<\/li>\n          <li><b>รายการใกล้เคียง<\/b> ในช่องที่มีรายการเยอะ (สินค้า ผู้ขาย โครงการ ลูกค้า บัญชี) ถ้าพิมพ์แล้วไม่มีชื่อที่ตรงทุกตัวอักษร ระบบจะแสดงหัวข้อสีส้ม <b>รายการใกล้เคียง<\/b> เป็นชื่อที่สะกดคล้ายหรือมีคำเดียวกัน และสินค้าในกลุ่มเดียวกัน เช่น พิมพ์ “สังกะสีลอนเล็ก” จะเห็น “สังกะสีลอนใหญ่” “สังกะสีแผ่นเรียบ” ให้เลือก พิมพ์ผิดวรรณยุกต์หรือพิมพ์ตกบางตัวก็ยังเจอ<\/li>\n          <li>ถ้าระบบเดาไม่ตรง ให้เลือกหมวดเองได้ทันที เมื่อเลือกเองแล้วระบบจะไม่เปลี่ยนทับ ถ้าชื่อนั้นมีอยู่ในทะเบียนสินค้าแล้ว ระบบใช้หมวดของสินค้าในทะเบียนก่อน<\/li>\n          <li>ในหน้าทะเบียนสินค้า พิมพ์ค้นหาแล้วจะมีปุ่มสีเขียว <b class=\"btn\">ประเภท: … · ดูทั้งหมด<\/b> กดเพื่อดูสินค้าทั้งหมดในกลุ่มเดียวกัน<\/li>\n        <\/ul>\n      <\/div>","เปิดใบขอซื้อ":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">PR<\/span><h3>เปิดใบขอซื้อ<\/h3><span class=\"num-ex\">เลขที่ เช่น PR-K68-007-11001<\/span><\/div>\n        <div class=\"meta\"><span class=\"who site\">หน้างาน<\/span><span class=\"who pm\">PM<\/span><span class=\"where\">จัดซื้อ / สั่งซื้อ › ใบขอซื้อ PR<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">สร้างใบขอซื้อ PR<\/b> แล้วเลือกแบบฟอร์ม: <b>ขอซื้อสินค้า (ไม่มีราคา)<\/b> ให้จัดซื้อใส่ราคาเอง, <b>ขอจ้างช่าง (มีราคา)<\/b> ต้องใส่ราคาทุกบรรทัด, หรือ <b>ขอซื้อและจ้างทำงาน<\/b> ต้องมีทั้งของและค่าแรงอย่างละหนึ่งบรรทัด<\/li>\n          <li>ถ้าโครงการมี BOQ ทุกบรรทัดต้องเลือกรายการ BOQ หรือเลือก <b>นอก BOQ<\/b> แล้วจึงเลือกสินค้า ใส่จำนวน หน่วย และวันที่ต้องการ<\/li>\n          <li>กด <b class=\"btn\">สร้างเอกสารและส่งขออนุมัติ<\/b> หรือ <b class=\"btn\">บันทึกร่าง<\/b> ไว้ก่อน ถ้าของชิ้นเดียวกันยังค้างรับจาก PR ก่อนหน้า ระบบจะเตือน<\/li>\n        <\/ul>\n        <div class=\"statusline\"><span class=\"lab\">สถานะ<\/span><span class=\"st\">ร่าง<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">รออนุมัติ<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">รอเจ้าของอนุมัติ<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">อนุมัติแล้ว<\/span><span class=\"arr\">›<\/span><span class=\"st\">ปิดใบขอซื้อ<\/span><\/div>\n      <\/div>","PM อนุมัติใบขอซื้อ":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">PR<\/span><h3>PM อนุมัติใบขอซื้อ<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who pm\">PM ของโครงการ<\/span><span class=\"who exec\">ผจก.ทั่วไป<\/span><span class=\"where\">K Tec Approve หรือหน้าใบขอซื้อ<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">อนุมัติ<\/b> หรือ <b class=\"btn\">ตีกลับ<\/b> พร้อมเหตุผล เมื่ออนุมัติ ผู้ขอและฝ่ายจัดซื้อจะได้รับแจ้ง<\/li>\n          <li>โครงการที่ยังไม่มี PM เจ้าของจะเป็นผู้อนุมัติแทน<\/li>\n        <\/ul>\n        <div class=\"branch\"><span class=\"tag\">ทางแยก: ขอเกิน BOQ หรือมีบรรทัดนอก BOQ<\/span><p>หลัง PM อนุมัติ ใบขอซื้อจะไปที่ <span class=\"st wait\">รอเจ้าของอนุมัติ<\/span> และ<b>เจ้าของ<\/b>ต้องอนุมัติอีกชั้นหนึ่ง<\/p><\/div>\n      <\/div>","เปิดใบสั่งซื้อ":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">PO<\/span><h3>เปิดใบสั่งซื้อ<\/h3><span class=\"num-ex\">เลขที่ เช่น PO-6911-0001<\/span><\/div>\n        <div class=\"meta\"><span class=\"who pur\">จัดซื้อ<\/span><span class=\"who pur\">หัวหน้าจัดซื้อ<\/span><span class=\"where\">จัดซื้อ / สั่งซื้อ › ใบสั่งซื้อ PO<\/span><\/div>\n        <ul class=\"do\">\n          <li>จากใบขอซื้อที่อนุมัติแล้ว กด <b class=\"btn\">+ เปิด PO จากใบขอซื้อนี้<\/b> หรือกด <b class=\"btn\">สร้างใบสั่งซื้อ PO<\/b> แล้วใช้ <b class=\"btn\">ดึงรายการจากใบขอซื้อ (PR)…<\/b><\/li>\n          <li>กด <b class=\"btn\">ตัดงบ BOQ<\/b> เพื่อผูกแต่ละบรรทัดกับงบ BOQ และ <b class=\"btn\">แนบรูป<\/b> ใบเสนอราคาได้<\/li>\n          <li>เลือกการชำระ: <b>เครดิต<\/b> (รับของก่อนจ่าย), <b>เงินสด / จ่ายก่อนรับของ<\/b>, หรือ <b>แบ่งจ่ายหลายงวด<\/b> (รวมทุกงวดต้องได้ 100%) รอบวางบิล วันเครดิต และวันรับเช็คดึงจากข้อมูลผู้ขายและแก้ในใบนี้ได้<\/li>\n          <li>ของใช้สำนักงานที่ไม่มีใบขอซื้อ เลือก <b>สำนักงาน / ส่วนกลาง (ไม่มี PR)<\/b> ถ้าราคาแพงกว่าครั้งก่อน ระบบจะขึ้น <span class=\"st wait\">ราคาสูงกว่ารอบที่แล้ว<\/span><\/li>\n          <li>กด <b class=\"btn\">ส่งขออนุมัติ PO<\/b><\/li>\n        <\/ul>\n      <\/div>","หัวหน้าจัดซื้อตรวจ แล้วผู้มีอำนาจอนุมัติ":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">PO<\/span><h3>หัวหน้าจัดซื้อตรวจ แล้วผู้มีอำนาจอนุมัติ<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who pur\">หัวหน้าจัดซื้อ<\/span><span class=\"who exec\">ผจก.ทั่วไป<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"where\">K Tec Approve หรือ จัดซื้อ / สั่งซื้อ › อนุมัติจัดซื้อ<\/span><\/div>\n        <ul class=\"do\">\n          <li><b>ขั้นตรวจ:<\/b> PO ทุกใบไปที่ <span class=\"st wait\">รอหัวหน้าจัดซื้อตรวจ<\/span> ก่อน หัวหน้าจัดซื้อกด <b class=\"btn\">อนุมัติ<\/b> เพื่อส่งต่อ (ตรวจใบที่ตัวเองเปิดไม่ได้ ถ้าหัวหน้าจัดซื้อเป็นคนส่งเอง ระบบข้ามขั้นนี้)<\/li>\n          <li><b>ขั้นอนุมัติ:<\/b> ยอดรวม VAT <b>ต่ำกว่าวงเงิน<\/b> (ค่าเริ่มต้น 50,000 บาท) หัวหน้าจัดซื้อ ผจก.ทั่วไป หรือเจ้าของอนุมัติได้ ยกเว้นคนที่เปิดใบนั้น ยอด<b>ตั้งแต่วงเงินขึ้นไป<\/b> เจ้าของเท่านั้น<\/li>\n          <li>อนุมัติแล้ว จัดซื้อสั่งของกับร้าน แล้วกด <b class=\"btn\">บันทึกว่าสั่งของกับร้านแล้ว<\/b><\/li>\n        <\/ul>\n        <div class=\"branch\"><span class=\"tag\">ทางแยก: ยอดเงินเกินงบวัสดุใน BOQ (รายบรรทัด หรือทั้งหมวดงาน)<\/span><p>ระบบตรวจสองแบบ: บรรทัด BOQ ที่ตัดงบ และ<b>ยอดรวมของหมวดงาน<\/b> เช่น งานโครงสร้าง งานสุขาภิบาล โดยนับทุก PO ในหมวดนั้นที่ยังไม่ยกเลิก ถ้าเกินแบบใดแบบหนึ่ง อนุมัติ PO ไม่ได้จนกว่าเจ้าของจะอนุมัติ <b>ใบ AP<\/b> ให้ก่อน จัดซื้อกด <b class=\"btn\">ขออนุมัติซื้อเกิน BOQ (ใบ AP)<\/b> พร้อมเหตุผล ใบนี้อยู่ที่เมนู จัดซื้อ / สั่งซื้อ › ใบ AP ในรายการจะบอกว่าเกินงบหมวดไหน และแสดงยอดที่เกินมากกว่าระหว่างรายบรรทัดกับทั้งหมวด<\/p><\/div>\n        <div class=\"statusline\"><span class=\"lab\">สถานะ PO<\/span><span class=\"st\">ร่าง<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">รอหัวหน้าจัดซื้อตรวจ<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">รออนุมัติ<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">อนุมัติแล้ว<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">สั่งของแล้ว<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">เสร็จสมบูรณ์<\/span><\/div>\n      <\/div>","รับของหน้างาน":"<div class=\"card\">\n        <div class=\"card-title\"><h3>รับของหน้างาน<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who site\">หน้างาน<\/span><span class=\"who pm\">PM<\/span><span class=\"where\">จัดซื้อ / สั่งซื้อ › รอรับสินค้า<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">บันทึกรับของ<\/b> หรือ <b class=\"btn\">รับของตาม PO นี้<\/b> จำนวนจะตั้งไว้เท่ากับที่ยังค้างรับ กด <b class=\"btn\">รับครบทุกรายการ<\/b> หรือปรับด้วยปุ่ม + / −<\/li>\n          <li>ใส่เลขใบส่งของ และ <b>ถ่ายรูปของที่มาส่ง / ใบส่งของ<\/b> แล้วกด <b class=\"btn\">ยืนยันรับของ<\/b> (ทำบนคอมพิวเตอร์หรือโน้ตบุ๊ก)<\/li>\n          <li>รับบางส่วนได้ รับเกินจำนวนสั่งไม่ได้ สต็อกเพิ่มให้อัตโนมัติ ผู้เปิด PO และการเงินจะได้รับแจ้ง PO ส่วนกลางให้ฝ่ายจัดซื้อเป็นคนรับ<\/li>\n        <\/ul>\n        <div class=\"grid2\">\n          <div class=\"branch\"><span class=\"tag\">ทางแยก: ของมาไม่ครบและไม่ส่งแล้ว<\/span><p>จัดซื้อกรอก ขอปิดยอดค้างรับ แล้วกด <b class=\"btn\">ส่งคำขอปิดยอดค้างรับ<\/b> เจ้าของอนุมัติ ระบบตัดยอด PO ให้เท่าที่รับจริง<\/p><\/div>\n          <div class=\"branch\"><span class=\"tag\">ทางแยก: ต้องแก้ PO ที่อนุมัติแล้ว<\/span><p>กด <b class=\"btn\">แก้ไข PO<\/b> ใส่เหตุผล แล้วส่งขออนุมัติใหม่ ระบบขึ้นว่ามีฉบับแก้ไขครั้งที่ N ลดจำนวนให้ต่ำกว่าที่รับแล้วไม่ได้<\/p><\/div>\n        <\/div>\n      <\/div>","ตั้งหนี้ (บันทึกยอดที่ต้องจ่าย)":"<div class=\"card\">\n        <div class=\"card-title\"><h3>ตั้งหนี้ (บันทึกยอดที่ต้องจ่าย)<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who pur\">จัดซื้อ<\/span><span class=\"where\">หน้า PO แต่ละใบ<\/span><\/div>\n        <ul class=\"do\">\n          <li><b>เครดิต:<\/b> การเงินกด <b class=\"btn\">+ บันทึกใบแจ้งหนี้ / ใบกำกับภาษี<\/b> แล้ว <b class=\"btn\">บันทึกเอกสาร<\/b> ทำได้หลังรับของแล้ว และยอดต้องไม่เกินมูลค่าของที่รับ ระบบคำนวณวันครบกำหนดจากรอบวางบิล วันเครดิต และวันจ่ายเช็คให้ และเลื่อนพ้นวันเสาร์-อาทิตย์<\/li>\n          <li><b>จ่ายก่อนรับของ:<\/b> จัดซื้อกด <b class=\"btn\">ขอเบิกเงินล่วงหน้า (Prepaid)<\/b> &nbsp;<b>แบ่งงวด:<\/b> กด <b class=\"btn\">ขอเบิกงวดนี้<\/b> ทีละงวด<\/li>\n          <li>ใบกำกับภาษีที่มาทีหลัง ให้ใช้ <b class=\"btn\">บันทึกการจับคู่ใบกำกับภาษี<\/b> ยอดหนี้จะไม่ถูกนับซ้ำ<\/li>\n        <\/ul>\n        <div class=\"statusline\"><span class=\"lab\">รายการตั้งหนี้<\/span><span class=\"st wait\">รอทำจ่าย<\/span><span class=\"arr\">›<\/span><span class=\"st\">อยู่ในใบสำคัญจ่าย<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">จ่ายแล้ว<\/span><\/div>\n        <div class=\"branch\"><span class=\"tag\">ทางแยก: คืนของ หรือผู้ขายลดราคาให้ (ใบลดหนี้ผู้ขาย)<\/span><p>เปิดใบแจ้งหนี้ผู้ขาย (AP) ใบนั้น ที่กล่อง <b>ใบลดหนี้ / ส่งคืนสินค้า<\/b> ใส่วันที่ใบลดหนี้ เลขที่ใบลดหนี้ของผู้ขาย และยอดลดหนี้รวม VAT (ไม่เกินยอดที่ระบบบอกว่าลดได้) แล้วกด <b class=\"btn\">ออกใบลดหนี้<\/b> ระบบลงบัญชีกลับรายการต้นทุนและภาษีซื้อทันที ยอดติดลบเข้าคิวตั้งจ่ายเป็น <span class=\"st\">ใบลดหนี้ผู้ขาย (หักยอด)<\/span> ให้ PV ใบถัดไปของผู้ขายรายนั้นหักออก และขึ้นเป็นยอดติดลบในรายงานภาษีซื้อ ยกเลิกใบลดหนี้ได้ระหว่างที่ยังอยู่ในคิว ส่วนใบแจ้งหนี้ที่มีใบลดหนี้อยู่ยกเลิกไม่ได้<\/p><\/div>\n      <\/div>","ทำใบสำคัญจ่าย":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">PV<\/span><h3>ทำใบสำคัญจ่าย<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"where\">ค่าแรง / งวดงาน › คิวตั้งจ่าย หรือ บัญชี / การเงิน › ใบสำคัญจ่าย (PV)<\/span><\/div>\n        <ul class=\"do\">\n          <li>คิวตั้งจ่ายเรียงตามวันครบกำหนด กด <b class=\"btn\">+ สร้างใบสำคัญจ่าย (PV)<\/b> เลือกผู้ขาย แล้วกด <b class=\"btn\">แสดงรายการค้างจ่าย<\/b> ติ๊กรายการที่จะจ่าย (หนึ่ง PV ต่อหนึ่งผู้ขาย)<\/li>\n          <li>เลือกหัก ณ ที่จ่าย 0 / 1 / 2 / 3 / 5% คิดจากยอดก่อน VAT ค่าเริ่มต้นมาจากข้อมูลผู้ขาย<\/li>\n          <li>ถ้ามีใบลดหนี้ผู้ขายค้างอยู่ ติ๊กรวมในใบเดียวกันได้ ยอดสุทธิของ PV ต้องเป็นบวก<\/li>\n          <li>กด <b class=\"btn\">ส่งขออนุมัติใบสำคัญจ่าย<\/b> เจ้าของได้รับแจ้ง<\/li>\n        <\/ul>\n      <\/div>","เจ้าของอนุมัติใบสำคัญจ่าย":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">PV<\/span><h3>เจ้าของอนุมัติใบสำคัญจ่าย<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who exec\">เจ้าของ<\/span><span class=\"where\">K Tec Approve<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">อนุมัติ<\/b> หรือ <b class=\"btn\">ตีกลับ<\/b> ถ้าจ่ายก่อนวันครบกำหนดหรือยอด PV เกินยอด PO ต้องใส่เหตุผล และกด <b class=\"btn\">อนุมัติพร้อมเหตุผลเกินวงเงิน<\/b><\/li>\n          <li>อนุมัติแล้ว การเงินได้รับแจ้งว่าพร้อมโอนจ่าย<\/li>\n        <\/ul>\n      <\/div>","จ่ายเงิน และออกหนังสือรับรองหัก ณ ที่จ่าย":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">50 ทวิ<\/span><h3>จ่ายเงิน และออกหนังสือรับรองหัก ณ ที่จ่าย<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"where\">หน้าใบสำคัญจ่าย<\/span><\/div>\n        <ul class=\"do\">\n          <li>เลือกวิธีจ่าย โอนเงิน / เช็ค / เงินสด แล้วกด <b class=\"btn\">ยืนยันบันทึกจ่ายเงิน ฿…<\/b> ถ้าเป็นเช็คต้องใส่เลขเช็ค ธนาคาร และวันที่<\/li>\n          <li>ถ้ามีหัก ณ ที่จ่าย ระบบออก 50 ทวิให้เอง: บุคคลธรรมดาเป็น ภ.ง.ด.3 นิติบุคคลเป็น ภ.ง.ด.53 กด <b class=\"btn\">พิมพ์ใบสำคัญจ่าย (PDF)<\/b> และ <b class=\"btn\">พิมพ์หนังสือรับรอง 50 ทวิ (PDF)<\/b><\/li>\n          <li>เช็ค: เมื่อผู้ขายมารับ กด <b class=\"btn\">ผู้ขายมารับเช็คแล้ว<\/b> เมื่อเช็คผ่าน กด <b class=\"btn\">บันทึกเช็คผ่าน<\/b> ดูเช็คที่ต้องเตรียมได้ที่ ตารางจ่ายเช็ค<\/li>\n          <li>PO จะเปลี่ยนเป็น <span class=\"st ok\">เสร็จสมบูรณ์<\/span> เองเมื่อรับของครบ จ่ายครบ และไม่มีเงินต้องคืน<\/li>\n          <li>ใบแจ้งหนี้ผู้ขายลงสมุดซื้อเมื่อบันทึก ส่วน PV ลงสมุดจ่ายเมื่อบันทึกจ่ายเงินแล้ว (ไม่ใช่ตอนอนุมัติ) ดู <a href=\"#ledger\">สมุดบัญชี<\/a><\/li>\n        <\/ul>\n        <div class=\"statusline\"><span class=\"lab\">สถานะ PV<\/span><span class=\"st\">ร่าง<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">รออนุมัติ<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">อนุมัติแล้ว<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">จ่ายแล้ว<\/span><\/div>\n      <\/div>","ส่งไฟล์ให้สำนักงานบัญชีทุกเดือน":"<div class=\"card\">\n        <div class=\"card-title\"><h3>ส่งไฟล์ให้สำนักงานบัญชีทุกเดือน<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">ผู้บริหาร<\/span><span class=\"where\">บัญชี / การเงิน › รายงาน/50 ทวิ<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">เลือกงวดเดือน<\/b> แล้วดาวน์โหลด Excel 3 ไฟล์: <b>PV จ่ายแล้ว<\/b>, <b>ภาษีซื้อ<\/b>, <b>ภ.ง.ด.3/53<\/b> หน้านี้รวม 50 ทวิทุกใบไว้ด้วย<\/li>\n        <\/ul>\n      <\/div>","ตั้งข้อมูลลูกค้า วงเงินเครดิต และพนักงานขาย":"<div class=\"card\">\n        <h3>ตั้งข้อมูลลูกค้า วงเงินเครดิต และพนักงานขาย<\/h3>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">ขาย / ลูกหนี้ › ลูกค้า<\/span><\/div>\n        <ul class=\"do\">\n          <li>เพิ่มหรือแก้ลูกค้า ใส่ <b>รหัสลูกค้า<\/b> <b>ชื่อลูกค้า<\/b> ที่อยู่ (ใช้ในใบกำกับภาษี) เลขประจำตัวผู้เสียภาษี สาขา (00000 = สำนักงานใหญ่) และเครดิต (วัน)<\/li>\n          <li>ใส่ <b>วงเงินเครดิต (บาท, 0 = ไม่จำกัด)<\/b> และเลือก <b>พนักงานขาย<\/b> รายการลูกค้าแสดงคอลัมน์ <b>วงเงิน / ค้างชำระ<\/b> ให้เห็นว่าใครใกล้เต็มวงเงิน<\/li>\n          <li>หน้าลูกค้าแต่ละราย มีตาราง <b>ยอดขายตามพนักงานขาย (ปีนี้ ก่อน VAT)<\/b><\/li>\n        <\/ul>\n      <\/div>","ใบเสนอราคา":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">QT<\/span><h3>ใบเสนอราคา<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">ขาย / ลูกหนี้ › ใบเสนอราคา<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">สร้างเอกสาร<\/b> เลือกลูกค้า และโครงการ (ถ้ามี)<\/li>\n          <li>แต่ละบรรทัดเลือกสินค้าในคลัง หรือ <b>ไม่ผูกสินค้าในคลัง (งานบริการ)<\/b> ใส่จำนวน ราคาต่อหน่วย และ <b>ส่วนลด (บาท)<\/b> ของบรรทัดนั้น<\/li>\n          <li>ส่วนลดท้ายบิลเลือกเป็น % หรือบาท แล้วเลือก <b>ประเภท VAT<\/b>: VAT 7% (แยก VAT) · ราคารวม VAT 7% · ราคารวม VAT 7% (ไม่แสดงยอด VAT) · ไม่มี VAT · ยกเว้น VAT<\/li>\n          <li>ระบบคำนวณ รวมเป็นเงิน › ส่วนลด › ราคาหลังหักส่วนลด › VAT › จำนวนเงินรวมทั้งสิ้น ให้เอง<\/li>\n        <\/ul>\n      <\/div>","ใบสั่งขาย":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">SO<\/span><h3>ใบสั่งขาย<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">ขาย / ลูกหนี้ › ใบสั่งขาย (SO)<\/span><\/div>\n        <ul class=\"do\">\n          <li>เปิดใบเสนอราคาที่ลูกค้าตกลง แล้วกด <b class=\"btn\">เปิดใบสั่งขายจากใบนี้<\/b> (หรือสร้างใบสั่งขายใหม่เองก็ได้) ตรวจรายการแล้วบันทึก<\/li>\n          <li>ใบสั่งขายคือการยืนยันคำสั่งซื้อของลูกค้า <b>ยังไม่ลงบัญชีและยังไม่ตัดสต็อก<\/b><\/li>\n          <li>แถบบนเอกสารบอก <b>อ้างอิงจาก<\/b> ใบก่อนหน้า และ <b>เปิดเป็นเอกสารแล้ว<\/b> ใบที่ทำต่อไป กดเลขที่เพื่อเปิดดูได้<\/li>\n        <\/ul>\n      <\/div>","ใบกำกับภาษี (ขายเชื่อ) ตัดสต็อกและลงต้นทุนขาย":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">TI<\/span><h3>ใบกำกับภาษี (ขายเชื่อ) ตัดสต็อกและลงต้นทุนขาย<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">ขาย / ลูกหนี้ › ใบกำกับภาษี<\/span><\/div>\n        <ul class=\"do\">\n          <li>จากใบสั่งขาย (หรือใบเสนอราคา) กด <b class=\"btn\">เปิดใบกำกับภาษีจากใบนี้<\/b> แล้วบันทึก<\/li>\n          <li>บรรทัดที่ผูกสินค้าจะ<b>ตัดสต็อก<\/b>จากคลังโครงการ (ถ้าเลือกโครงการ) หรือคลังกลาง และลง<b>ต้นทุนขาย<\/b>ตามต้นทุนเฉลี่ยให้อัตโนมัติ ถ้าสต็อกไม่พอ ระบบไม่ให้บันทึก<\/li>\n          <li>ระบบลงบัญชีขาย ภาษีขาย และลูกหนี้ให้ทันที ใบกำกับภาษีอย่างย่อ (ขายปลีก) ก็ตัดสต็อกแบบเดียวกัน<\/li>\n          <li><b class=\"btn\">พิมพ์ / บันทึก PDF<\/b> ได้สองชุดในครั้งเดียว: <b>ต้นฉบับ (ลูกค้า)<\/b> และ <b>สำเนา (บริษัท)<\/b> ใบเสร็จรับเงินและใบเพิ่มหนี้พิมพ์แบบเดียวกัน<\/li>\n        <\/ul>\n        <div class=\"branch\"><span class=\"tag\">ทางแยก: ต้องแก้ใบกำกับภาษีที่ออกแล้ว<\/span><p>เอกสารภาษีที่ออกแล้วแก้ทับไม่ได้ เมื่อแก้แล้วบันทึก ใบเดิมจะถูกยกเลิกและออกใบใหม่เลขใหม่แทน การยกเลิกใบกำกับภาษีคืนสต็อกและยกเลิกรายการบัญชีให้<\/p><\/div>\n      <\/div>","รับเงินและติดตามหนี้":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">REC<\/span><h3>รับเงินและติดตามหนี้<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">ขาย / ลูกหนี้ › ใบเสร็จรับเงิน · ลูกหนี้<\/span><\/div>\n        <ul class=\"do\">\n          <li>เมื่อลูกค้าจ่าย ออก <b>ใบเสร็จรับเงิน<\/b> ระบบลงสมุดรับเงินให้<\/li>\n          <li>ดูยอดค้างตามอายุหนี้ที่ <b>ลูกหนี้<\/b> หน้ารายการเอกสารขายทุกประเภทมีปุ่ม <b class=\"btn\">Export CSV<\/b><\/li>\n        <\/ul>\n        <div class=\"statusline\"><span class=\"lab\">สายเอกสาร<\/span><span class=\"st\">QT<\/span><span class=\"arr\">›<\/span><span class=\"st\">SO<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">TI ตัดสต็อก + ตั้งลูกหนี้<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">REC รับเงิน<\/span><\/div>\n      <\/div>","สร้างโครงการ":"<div class=\"card\">\n        <h3>สร้างโครงการ<\/h3>\n        <div class=\"meta\"><span class=\"who pur\">จัดซื้อ<\/span><span class=\"who exec\">ผู้บริหาร<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">โครงการ<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">สร้างโครงการ<\/b> ใส่ชื่อโครงการ (ช่องเดียวที่บังคับ) ถ้าไม่ใส่รหัส ระบบออกรหัส PJ ให้ ใส่ลูกค้า สถานที่ วันเริ่ม-สิ้นสุด งบประมาณ และรูปปก<\/li>\n          <li>มีสัญญาเป็น PDF กด <b class=\"btn\">นำเข้าข้อมูล PDF<\/b> ระบบอ่านและเติมเฉพาะช่องที่ยังว่าง สีเขียวคืออ่านตรงกัน สีเหลืองคือควรตรวจซ้ำ<\/li>\n          <li>ตั้ง PM ที่แท็บ ภาพรวม › ข้อมูลโครงการ › <b class=\"btn\">แก้ไข<\/b> แล้วเพิ่มคนที่แท็บ ทีมงาน ด้วย <b class=\"btn\">เพิ่มคนเข้าทีม<\/b><\/li>\n        <\/ul>\n      <\/div>","เริ่มงานถอดแบบ":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">TO<\/span><h3>เริ่มงานถอดแบบ<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who site\">วิศวกร<\/span><span class=\"who site\">สถาปนิก<\/span><span class=\"who pm\">PM<\/span><span class=\"who pur\">จัดซื้อ<\/span><span class=\"who exec\">ผู้บริหาร<\/span><span class=\"where\">ถอดแบบ BOQ (PDF)<\/span><\/div>\n        <ul class=\"do\">\n          <li>กดเมนู <b>ถอดแบบ BOQ (PDF)<\/b> ที่แถบซ้าย (ใต้ Timeline โครงการ) แล้วกด <b class=\"btn\">ถอดแบบใหม่<\/b><\/li>\n          <li>ใส่ชื่องาน เช่น อาคาร A ชั้น 1 งานสถาปัตย์ เลือกโครงการ (ไม่บังคับ) แล้วกด <b class=\"btn\">สร้างแล้วเลือกไฟล์ PDF<\/b> ระบบออกเลขที่ TO ให้<\/li>\n          <li>กด <b class=\"btn\">เลือกไฟล์ PDF<\/b> หรือลากไฟล์มาวาง แบบหลายหน้าเลือกหน้าได้ที่ช่อง หน้า 1/N (หน้าที่มีการวัดแล้วมีจุด •)<\/li>\n          <li>ครั้งต่อไปที่เปิดงานเดิมบนเครื่องเดิม แบบจะเปิดขึ้นมาเอง ถ้าเปิดจากเครื่องอื่น ระบบจะขอให้เลือกไฟล์เดิมอีกครั้ง และเตือนถ้าเลือกไฟล์ที่ไม่ใช่ไฟล์เดียวกัน<\/li>\n        <\/ul>\n      <\/div>","ทำ BOQ":"<div class=\"card\">\n        <h3>ทำ BOQ<\/h3>\n        <div class=\"meta\"><span class=\"who pm\">PM<\/span><span class=\"who site\">วิศวกร<\/span><span class=\"who site\">สถาปนิก<\/span><span class=\"who exec\">ผู้บริหาร<\/span><span class=\"where\">โครงการ › แท็บ BOQ<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">สร้าง BOQ หลัก<\/b> แล้วพิมพ์ในตาราง หรือ Import ไฟล์ Excel (.xls / .xlsx / .csv) ระบบให้ตรวจก่อนนำเข้า เตือนชื่อโครงการไม่ตรง แถวไม่มีราคา และยอดไม่ตรง<\/li>\n          <li>ไฟล์ที่มีราคาสองชุด ให้เลือก ค่างานต้นทุน หรือ ราคาต่อหน่วยตามคำเสนอ แล้วกด <b class=\"btn\">บันทึก<\/b> (ยังไม่บันทึกจนกว่าจะกด)<\/li>\n          <li>ใต้ตาราง BOQ มีตาราง <b>สรุปราคาแยกตามหมวดงาน<\/b>: ค่าวัสดุ ค่าแรง รวม และสัดส่วน % ของแต่ละหมวด รายการนับเข้าหมวดที่อยู่เหนือมันใกล้ที่สุด ตารางนี้ออกในหน้าพิมพ์และไฟล์ CSV ด้วย<\/li>\n          <li>ช่อง <b>หน่วย<\/b> เลือกจากหน่วยในทะเบียนสินค้าได้ ช่องสีเหลือง = เขียนไม่ตรงทะเบียน ช่องสีแดง = สินค้าในทะเบียนนับคนละหน่วย (ชี้เมาส์ดูหน่วยที่ถูก) กด <b class=\"btn\">หน่วยตามทะเบียน<\/b> ที่แถบเครื่องมือเพื่อแก้ช่องสีเหลืองทั้งหมดในครั้งเดียว ช่องสีแดงให้แก้หน่วยและจำนวนเอง เมื่อหน่วยตรงกัน เปิด PR จาก BOQ แล้วหน่วยจะตรงกับสินค้าที่เลือก<\/li>\n          <li>แถวที่นับเป็น กก. แต่ซื้อเป็นเส้นหรือแผ่น กด <b class=\"btn\">แปลงหน่วย<\/b> ตรวจหรือแก้น้ำหนักต่อเส้น/แผ่น แล้วกด <b class=\"btn\">แปลง<\/b> ระบบหารจำนวนและคูณราคาต่อหน่วยให้ ยอดเงินเท่าเดิม กด <b class=\"btn\">บันทึก<\/b> เพื่อยืนยัน รายการที่มีใบขอซื้อหรือใบสั่งซื้อแล้วเปลี่ยนหน่วยไม่ได้<\/li>\n          <li>แปลงแล้วช่องหน่วยยังเป็นสีแดง แปลว่าทะเบียนสินค้ายังตั้งหน่วยอื่นไว้ กดปุ่ม <b class=\"btn\">แก้ทะเบียน<\/b> ใต้หน่วย แล้วกดตกลง ระบบเปลี่ยนหน่วยในทะเบียนสินค้าให้ตรง BOQ (เฉพาะผู้ที่แก้ทะเบียนสินค้าได้)<\/li>\n          <li>ถ้าอยากให้สินค้าเหล็กทั้งหมดในทะเบียนนับเป็นเส้น ไปที่เมนู <b>ทะเบียนสินค้า<\/b> ค้นหา “เหล็ก” ติ๊กเลือก ใส่หน่วยใหม่ แล้วกด <b class=\"btn\">เปลี่ยนหน่วย<\/b> ได้ทีเดียวหลายรายการ<\/li>\n          <li>BOQ คือฐานของการคุมงบ: PR ถูกตรวจจำนวน PO ถูกตรวจเงินทั้งรายบรรทัดและทั้งหมวด ระบบเตือนเมื่อใช้ถึง 50% 80% 100% และเมื่อเกิน บรรทัดที่ถูกใช้ใน PR หรือ PO แล้วลบไม่ได้<\/li>\n        <\/ul>\n      <\/div>","วางแผนงานและอัปเดตความคืบหน้า":"<div class=\"card\">\n        <h3>วางแผนงานและอัปเดตความคืบหน้า<\/h3>\n        <div class=\"meta\"><span class=\"who pm\">PM<\/span><span class=\"who site\">หน้างาน<\/span><span class=\"where\">โครงการ › แท็บ งาน / แกนต์ / ปฏิทิน<\/span><\/div>\n        <ul class=\"do\">\n          <li><b class=\"btn\">เพิ่มงาน<\/b>: เลือก <b>กลุ่มงาน<\/b> ก่อน รายการคือหมวดหลักใน BOQ ของโครงการ (เช่น 1 งานวิศวกรรมโครงสร้าง 2 งานสถาปัตยกรรม) เลือกแล้วถ้าโครงการยังไม่มีกลุ่มนี้ ระบบสร้างให้เอง ถ้ามีแล้วใช้กลุ่มเดิม แล้วเลือก <b>หมวดงาน<\/b> ซึ่งแสดงเฉพาะหมวดย่อยใน BOQ ของกลุ่มที่เลือก (เช่น 1.11 งานโครงหลังคา) ถ้าไม่มีในรายการให้เลือก <b>อื่น ๆ (พิมพ์ชื่อเอง)<\/b> เลือก <b>— ไม่มี (ตั้งเป็นกลุ่มงานใหม่) —<\/b> ถ้าต้องการให้รายการนี้เป็นกลุ่มงานเอง (ลึกได้หนึ่งชั้น) โครงการที่ยังไม่มี BOQ กลุ่มงานจะเป็นรายการมาตรฐานและหมวดงานพิมพ์เอง จากนั้นใส่วันที่ ความสำคัญ มูลค่างาน และผู้รับผิดชอบ การ์ดที่มีหมวดงานอยู่ข้างใต้จะมีคำว่า (กลุ่มงาน) ต่อท้าย แกนต์และ S-Curve สร้างจากงานที่มีวันเริ่มและวันสิ้นสุด<\/li>\n          <li>คนหน้างานเปลี่ยนได้แค่สถานะกับ % ของงาน ตั้งเป็นเสร็จสิ้นแล้ว % จะเป็น 100<\/li>\n          <li>ปฏิทิน: ดับเบิลคลิกวันที่เพื่อ <b class=\"btn\">เพิ่มนัดหมาย<\/b><\/li>\n        <\/ul>\n      <\/div>","รายงานประจำวัน":"<div class=\"card\">\n        <h3>รายงานประจำวัน<\/h3>\n        <div class=\"meta\"><span class=\"who site\">หน้างาน<\/span><span class=\"who pm\">PM<\/span><span class=\"where\">โครงการ › แท็บ รายงาน<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">สร้างรายงาน<\/b> กรอกสภาพอากาศเช้า-บ่าย งานที่ทำ แรงงาน เครื่องจักร ความปลอดภัย ผู้เยี่ยมชม และรูป<\/li>\n          <li>ในแถวความคืบหน้า เลือกงานจากแกนต์แล้วใส่ ผลงานวันนี้ (%) ตัวเลขนี้จะ<b>บวกเพิ่ม<\/b>เข้าความคืบหน้าของงาน (ไม่เกิน 100%)<\/li>\n          <li><b class=\"btn\">บันทึก Draft<\/b> ไว้ก่อน แล้ว <b class=\"btn\">ส่งรายงาน<\/b> ส่งแล้วแก้ไม่ได้ รายงานรายสัปดาห์และรายเดือนสร้างจากรายงานประจำวันที่ส่งแล้วเท่านั้น<\/li>\n        <\/ul>\n      <\/div>","งานเพิ่ม/ลด":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">VO<\/span><h3>งานเพิ่ม/ลด<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who pm\">PM<\/span><span class=\"who exec\">ผจก.ทั่วไป<\/span><span class=\"who exec\">เจ้าของอนุมัติ<\/span><span class=\"where\">โครงการ › แท็บ งานเพิ่ม/ลด (VO)<\/span><\/div>\n        <ul class=\"do\">\n          <li><b class=\"btn\">สร้าง VO<\/b> กรอกข้อมูลทั่วไป ผลกระทบต้นทุน ผลกระทบแผนงาน และรายการ BOQ แล้ว <b class=\"btn\">บันทึก VO<\/b> และ <b class=\"btn\">ส่งอนุมัติ<\/b><\/li>\n          <li>เจ้าของอนุมัติแล้ว มูลค่าสัญญาและวันสิ้นสุดเปลี่ยนตาม และได้แผ่น BOQ งานเพิ่มแยกต่างหาก<\/li>\n        <\/ul>\n        <div class=\"statusline\"><span class=\"lab\">สถานะ<\/span><span class=\"st\">ร่าง<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">รออนุมัติ<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">อนุมัติแล้ว<\/span><span class=\"arr\">/<\/span><span class=\"st bad\">ไม่อนุมัติ<\/span><\/div>\n      <\/div>","ติดตามเงินและผลงาน":"<div class=\"card\">\n        <h3>ติดตามเงินและผลงาน<\/h3>\n        <div class=\"meta\"><span class=\"who pm\">PM<\/span><span class=\"who fin\">การเงิน<\/span><span class=\"who pur\">จัดซื้อ<\/span><span class=\"who exec\">ผู้บริหาร<\/span><\/div>\n        <ul class=\"do\">\n          <li><b>รายรับรายจ่ายโครงการ<\/b>: เงินเข้าจากใบเสร็จลูกค้า เงินออกจาก PV ที่จ่ายแล้ว มีปุ่ม <b class=\"btn\">วางบิลลูกค้า<\/b> และ <b class=\"btn\">ขอเบิกจ่าย (PRV)<\/b><\/li>\n          <li><b>Cost Performance<\/b>: CPI SPI EAC และ S-Curve เทียบงบ BOQ กับต้นทุนจริง<\/li>\n          <li><b>Timeline โครงการ<\/b>: แถบหนึ่งเส้นต่อโครงการ สีน้ำเงินคือช่วงสัญญา สีเขียวคือผลงานจริง (ทำได้ X% / แผน Y%)<\/li>\n        <\/ul>\n      <\/div>","ส่งมอบโครงการ":"<div class=\"card\">\n        <h3>ส่งมอบโครงการ<\/h3>\n        <div class=\"meta\"><span class=\"who pm\">PM<\/span><span class=\"who exec\">ผจก.ทั่วไป<\/span><span class=\"who exec\">เจ้าของ<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">บันทึกการส่งมอบ<\/b> เลือกสถานะ วันที่ ผู้ตรวจรับ ระยะประกันผลงานทั่วไป (เริ่มต้น 12 เดือน) และประกันโครงสร้าง (เริ่มต้น 60 เดือน)<\/li>\n          <li>เมื่อเลือก ลูกค้าตรวจรับแล้ว ระบบออกเลขใบรับประกัน (WAR) และเปลี่ยนโครงการเป็นเสร็จสิ้น<\/li>\n        <\/ul>\n        <div class=\"statusline\"><span class=\"st\">นัดส่งมอบ<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">ส่งมอบแล้ว รอตรวจรับ<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">ลูกค้าตรวจรับแล้ว<\/span><\/div>\n      <\/div>","ใบรับประกันผลงานและแจ้งซ่อม":"<div class=\"card\">\n        <h3>ใบรับประกันผลงานและแจ้งซ่อม<\/h3>\n        <div class=\"meta\"><span class=\"who site\">หน้างาน<\/span><span class=\"who pm\">PM<\/span><span class=\"who exec\">ผู้บริหาร<\/span><\/div>\n        <ul class=\"do\">\n          <li>คลิกโครงการที่ส่งมอบแล้ว เปิด <b>รายการแจ้งซ่อม<\/b> ใส่อาการ ตำแหน่ง ผู้แจ้ง แล้วกด <b class=\"btn\">แจ้ง<\/b> ได้เลข DF<\/li>\n          <li>อัปเดตสถานะงานซ่อม จนเป็นซ่อมเสร็จ (ใส่วิธีแก้ไข) หรือไม่อยู่ในเงื่อนไขประกัน (ใส่เหตุผล) หมดประกันแล้วแจ้งซ่อมไม่ได้<\/li>\n        <\/ul>\n        <div class=\"statusline\"><span class=\"st\">รับแจ้ง<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">กำลังซ่อม<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">ซ่อมเสร็จ<\/span><\/div>\n      <\/div>","แผนงวดงานจ่าย (ผู้รับเหมา)":"<div class=\"card\">\n        <h3>แผนงวดงานจ่าย (ผู้รับเหมา)<\/h3>\n        <p class=\"note\">เปิดโครงการ แล้วกด <b class=\"btn\">เพิ่มงวดงาน<\/b> หรือ <b class=\"btn\">สร้างจาก BOQ<\/b> (หนึ่งงวดต่อหนึ่งหมวด BOQ หักประกันผลงาน 5% เป็นค่าเริ่มต้น)<\/p>\n        <div class=\"statusline\"><span class=\"st\">ตามแผน<\/span><span class=\"arr\">›<\/span><b class=\"btn\">รับใบเบิกงวด<\/b><span class=\"arr\">›<\/span><b class=\"btn\">อนุมัติ<\/b><span class=\"arr\">›<\/span><b class=\"btn\">บันทึกจ่าย<\/b><\/div>\n        <div class=\"meta\"><span class=\"who pm\">PM รับใบเบิก<\/span><span class=\"who exec\">ผจก.ทั่วไป / เจ้าของ อนุมัติ<\/span><span class=\"who fin\">การเงิน จ่าย<\/span><\/div>\n      <\/div>","เปิดใบขอเบิก":"<div class=\"card\">\n        <h3>เปิดใบขอเบิก<\/h3>\n        <div class=\"meta\"><span class=\"who site\">หน้างาน<\/span><span class=\"who pur\">จัดซื้อ<\/span><span class=\"who fin\">การเงิน<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">เปิดใบขอเบิกเงินใหม่ (PRV)<\/b> เลือกประเภท: งวดงานผู้รับเหมา, ค่าใช้จ่ายทั่วไปของโครงการ หรือเบิกชดเชยเงินสดย่อย<\/li>\n          <li>เลือกผู้รับเงิน งวดที่ รายการและผลงานงวดนี้ (%) ประกันผลงาน หัก ณ ที่จ่าย VAT และวิธีจ่าย เช็คหรือโอน แล้ว <b class=\"btn\">บันทึกใบขอเบิกเงิน (PRV)<\/b><\/li>\n          <li>ยอดสุทธิ = ยอดเบิก − ประกันผลงาน − หัก ณ ที่จ่าย + VAT (หัก ณ ที่จ่ายคิดจากยอดเบิกหลังหักประกันผลงาน)<\/li>\n        <\/ul>\n      <\/div>","ส่งขอเบิก":"<div class=\"card\">\n        <h3>ส่งขอเบิก<\/h3>\n        <ul class=\"do\"><li>กด <b class=\"btn\">ส่งขอเบิกเงิน<\/b> PM ผจก.ทั่วไป และเจ้าของได้รับแจ้ง<\/li><\/ul>\n        <div class=\"statusline\"><span class=\"st wait\">ส่งขอเบิก (รอ PM ตรวจ)<\/span><\/div>\n      <\/div>","PM รับรองผลงาน":"<div class=\"card\">\n        <h3>PM รับรองผลงาน<\/h3>\n        <div class=\"meta\"><span class=\"who pm\">PM ของโครงการ<\/span><span class=\"who exec\">ผจก.ทั่วไป<\/span><span class=\"who exec\">เจ้าของ<\/span><\/div>\n        <ul class=\"do\"><li>กด <b class=\"btn\">PM รับรองผลงาน ➔ ส่งเจ้าของอนุมัติ<\/b> หรือ <b class=\"btn\">ตีกลับ<\/b> พร้อมเหตุผล<\/li><\/ul>\n        <div class=\"statusline\"><span class=\"st wait\">PM ตรวจแล้ว (รอเจ้าของอนุมัติ)<\/span><\/div>\n      <\/div>","เจ้าของอนุมัติจ่าย":"<div class=\"card\">\n        <h3>เจ้าของอนุมัติจ่าย<\/h3>\n        <div class=\"meta\"><span class=\"who exec\">เจ้าของ<\/span><\/div>\n        <ul class=\"do\"><li>กด <b class=\"btn\">เจ้าของอนุมัติจ่าย<\/b> ระบบสร้างรายการในคิวตั้งจ่าย และแจ้งผู้ขอกับการเงิน<\/li><\/ul>\n        <div class=\"statusline\"><span class=\"st ok\">อนุมัติแล้ว (ส่งการเงิน)<\/span><\/div>\n      <\/div>","การเงินออกใบสำคัญจ่าย":"<div class=\"card\">\n        <h3>การเงินออกใบสำคัญจ่าย<\/h3>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><\/div>\n        <ul class=\"do\"><li>กด <b class=\"btn\">ออกใบสำคัญจ่าย (PV) ➔<\/b> แล้วทำต่อตามขั้นที่ 7–9 ของสายจัดซื้อ<\/li><\/ul>\n      <\/div>","เงินทดรองจ่าย":"<div class=\"card\">\n        <h3>เงินทดรองจ่าย<\/h3>\n        <div class=\"meta\"><span class=\"who admin\">ทุกคนขอได้<\/span><\/div>\n        <ul class=\"do\">\n          <li>สร้าง <b>ใบขอเงินทดรองจ่าย<\/b> แล้ว <b class=\"btn\">ส่งขออนุมัติ<\/b> ผจก.ทั่วไป เจ้าของ หรือแอดมินอนุมัติ การเงินกด <b class=\"btn\">บันทึกจ่ายเงิน<\/b><\/li>\n          <li>เคลียร์: เพิ่มรายการค่าใช้จ่ายพร้อมหลักฐาน (มีใบเสร็จ / ใบรับรองแทนใบเสร็จ / ไม่มีหลักฐาน) เงินเหลือ การเงินกด <b class=\"btn\">บันทึกเงินคืน<\/b><\/li>\n        <\/ul>\n        <div class=\"statusline\"><span class=\"st wait\">รออนุมัติ<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">อนุมัติแล้ว<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">รอเคลียร์<\/span><span class=\"arr\">›<\/span><span class=\"st\">เคลียร์บางส่วน<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">เคลียร์ครบ<\/span><\/div>\n      <\/div>","ใบรับรองแทนใบเสร็จ":"<div class=\"card\">\n        <h3>ใบรับรองแทนใบเสร็จ<\/h3>\n        <div class=\"meta\"><span class=\"who admin\">ทุกคนขอได้<\/span><span class=\"who fin\">การเงิน / เจ้าของ อนุมัติ<\/span><\/div>\n        <ul class=\"do\">\n          <li>สำหรับค่าใช้จ่ายที่ไม่มีใบเสร็จ กด <b class=\"btn\">+ สร้างเอกสาร<\/b> <b class=\"btn\">บันทึกร่าง<\/b> แล้ว <b class=\"btn\">ส่งขออนุมัติ<\/b> เลขที่จะออกตอนส่ง<\/li>\n          <li>ใช้เคลียร์เงินทดรองได้เมื่ออนุมัติแล้วเท่านั้น ถ้าไม่อนุมัติ แก้แล้วส่งใหม่ได้<\/li>\n        <\/ul>\n      <\/div>","รายรับจากลูกค้า":"<div class=\"card\">\n        <h3>รายรับจากลูกค้า<\/h3>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">บัญชี / การเงิน › ขาย / ลูกหนี้<\/span><\/div>\n        <ul class=\"do\">\n          <li>ใบแจ้งหนี้/วางบิล (ลูกค้า): <b class=\"btn\">บันทึกฉบับร่าง<\/b> › <b class=\"btn\">วางบิล (ออกเลขที่)<\/b> › <b class=\"btn\">บันทึกรับเงิน<\/b> ได้ใบเสร็จ ใส่หัก ณ ที่จ่ายและประกันผลงานได้ รับบางส่วนได้<\/li>\n          <li>ถ้าบิลนี้ทำให้ยอดค้างของลูกค้าเกิน <b>วงเงินเครดิต<\/b> จะขึ้นคำเตือนให้เห็น แต่ยังวางบิลได้<\/li>\n          <li>ออกใบลดหนี้จากใบแจ้งหนี้ได้ ดูยอดค้างตามอายุหนี้ที่ <b>ลูกหนี้<\/b> และภาษีขายรายเดือนที่ <b>ภาษีขาย<\/b> (กลุ่ม บัญชี / ภาษี)<\/li>\n          <li>ขายสินค้าด้วยใบเสนอราคา ใบสั่งขาย และใบกำกับภาษี ดูขั้นตอนที่ <a href=\"#sales\">ขาย<\/a> ส่วนใบเสร็จรับเงิน ใบเพิ่มหนี้ รายรับ รายจ่าย: กด <b class=\"btn\">สร้างเอกสาร<\/b> ออกเลขทันที พิมพ์ด้วย <b class=\"btn\">พิมพ์ / บันทึก PDF<\/b><\/li>\n        <\/ul>\n      <\/div>","งานบัญชี":"<div class=\"card\">\n        <h3>งานบัญชี<\/h3>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><\/div>\n        <ul class=\"do\">\n          <li><b>การเงิน › สแกนบิล<\/b>: อัปโหลด JPG / PNG / PDF ระบบอ่านให้ ตรวจทุกช่องแล้วกด <b class=\"btn\">บันทึกเป็นรายจ่าย และแนบไฟล์บิล<\/b><\/li>\n          <li><b>การเงิน › เงินสด / ธนาคาร<\/b>: <b class=\"btn\">เพิ่มบัญชีธนาคาร<\/b> ยอดคำนวณจากใบเสร็จ รายรับ รายจ่าย เทียบกับ Statement ได้ที่ <b>กระทบยอดธนาคาร<\/b><\/li>\n          <li><b>บัญชี / ภาษี<\/b>: ภาษีซื้อ ดึงจาก PO PV และใบรับเข้าสต็อกที่มีใบกำกับภาษี (ใบลดหนี้ผู้ขายขึ้นเป็นยอดติดลบ) หัก ณ ที่จ่าย รวม 50 ทวิที่ออกอัตโนมัติ และหมวดรายรับ-รายจ่ายที่ ตั้งค่าบัญชีและภาษี<\/li>\n          <li><b>รายงาน<\/b>: รายงานบัญชี รายงานภาษีหัก ณ ที่จ่าย รายงาน/50 ทวิ รายงานงบประมาณโครงการ<\/li>\n          <li>สมุดรายวัน งบทดลอง ยอดยกมา และปิดงวด ดู <a href=\"#ledger\">สมุดบัญชี · ปิดงวด<\/a><\/li>\n        <\/ul>\n      <\/div>","ตรวจผังบัญชี":"<div class=\"card\">\n        <h3>ตรวจผังบัญชี<\/h3>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">บัญชี / ภาษี › สมุดรายวัน / ผังบัญชี › แท็บ ผังบัญชี<\/span><\/div>\n        <ul class=\"do\">\n          <li>ระบบตั้งผังบัญชีมาตรฐานไทยไว้ให้แล้ว เพิ่มหรือแก้ชื่อบัญชีได้ และเลือกได้ว่าเอกสารแต่ละแบบลงบัญชีไหน<\/li>\n          <li>เปลี่ยนบัญชีแล้วมีผลกับเอกสารที่บันทึกต่อจากนี้ รายการเก่าคงเดิมจนกว่าจะกด <b class=\"btn\">ลงบัญชีย้อนหลัง / ตรวจสอบ<\/b><\/li>\n        <\/ul>\n      <\/div>","ตั้งยอดยกมา (ครั้งแรกที่เริ่มใช้)":"<div class=\"card\">\n        <h3>ตั้งยอดยกมา (ครั้งแรกที่เริ่มใช้)<\/h3>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">บัญชี / ภาษี › ยอดยกมา<\/span><\/div>\n        <ul class=\"do\">\n          <li><b>1. ยอดบัญชียกมา<\/b>: ใส่ยอดเดบิต/เครดิตของแต่ละบัญชีให้รวมเท่ากัน แล้วกด <b class=\"btn\">บันทึกยอดยกมา<\/b> บันทึกซ้ำจะแทนที่รายการเดิม<\/li>\n          <li><b>2. ลูกหนี้คงค้างยกมา<\/b>: ลูกค้า เลขที่บิลเดิม ยอดค้าง วันครบกำหนด รับเงินจากบิลเหล่านี้ได้ตามปกติ<\/li>\n          <li><b>3. เจ้าหนี้คงค้างยกมา<\/b>: ผู้ขาย เลขที่บิลเดิม ยอดค้าง เข้าคิวตั้งจ่ายให้จ่ายด้วย PV<\/li>\n          <li>หน้าเทียบยอดรวมของข้อ 2 และ 3 กับบัญชีลูกหนี้/เจ้าหนี้ในข้อ 1 ถ้าตรงจะขึ้น <span class=\"st ok\">✓ ตรงกัน<\/span><\/li>\n        <\/ul>\n      <\/div>","ลงบัญชีอัตโนมัติ และดูสมุด":"<div class=\"card\">\n        <div class=\"card-title\"><span class=\"code\">JV<\/span><h3>ลงบัญชีอัตโนมัติ และดูสมุด<\/h3><\/div>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">ผจก.ทั่วไป<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">บัญชี / ภาษี › สมุดรายวัน / ผังบัญชี<\/span><\/div>\n        <ul class=\"do\">\n          <li>ลงให้เอง: ใบแจ้งหนี้ผู้ขาย (สมุดซื้อ) · PV เมื่อจ่ายแล้ว (สมุดจ่าย) · ใบแจ้งหนี้ลูกค้าเมื่อวางบิล (สมุดขาย) · รับเงิน (สมุดรับ) · ใบลดหนี้ · ใบกำกับภาษีพร้อมต้นทุนขาย · ใบเสร็จ รายรับ รายจ่าย · ใบปรับปรุงสต็อก AJ แต่ละรายการได้เลข JV<\/li>\n          <li>ยกเลิกหรือแก้เอกสาร ระบบยกเลิกรายการบัญชีเดิมและลงใหม่ให้<\/li>\n          <li>แท็บ <b>สมุดรายวัน<\/b> (ค้นหา กรองตามสมุด ประเภทเอกสาร และช่วงวันที่) · <b>งบทดลอง<\/b> · <b>บัญชีแยกประเภท<\/b> (เลือกบัญชี) · <b>ผังบัญชี<\/b> ทุกแท็บส่งออก CSV ได้<\/li>\n          <li><b class=\"btn\">ลงบัญชีย้อนหลัง / ตรวจสอบ<\/b>: ลงเอกสารที่ทำไว้ก่อนมีระบบนี้ และตรวจทุกรายการกับเอกสารอีกรอบ กดซ้ำได้ ไม่เกิดรายการซ้ำ<\/li>\n        <\/ul>\n      <\/div>","กระทบยอดเงินฝากธนาคาร":"<div class=\"card\">\n        <h3>กระทบยอดเงินฝากธนาคาร<\/h3>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">การเงิน › กระทบยอดธนาคาร<\/span><\/div>\n        <ul class=\"do\">\n          <li>เลือกบัญชีธนาคาร ใส่วันที่และ <b>ยอดตาม Statement ธนาคาร<\/b><\/li>\n          <li>ติ๊กรายการฝาก/รับ และถอน/จ่าย ที่อยู่ใน Statement ระบบโชว์ยอดกระทบยอดแล้ว + ที่เลือก กด <b class=\"btn\">บันทึกการกระทบยอด<\/b> ได้เมื่อยอดเท่ากับ Statement<\/li>\n          <li>รายการที่ไม่ได้ติ๊กค้างไว้กระทบรอบหน้า ถ้าบันทึกผิด กด <b class=\"btn\">ยกเลิก Statement ล่าสุด<\/b><\/li>\n        <\/ul>\n      <\/div>","ปิดงวดรายเดือน และปิดบัญชีสิ้นปี":"<div class=\"card\">\n        <h3>ปิดงวดรายเดือน และปิดบัญชีสิ้นปี<\/h3>\n        <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">บัญชี / ภาษี › ปิดงวด / ปิดบัญชีสิ้นปี<\/span><\/div>\n        <ul class=\"do\">\n          <li>ทำหลังยื่น ภ.พ.30 / ภ.ง.ด. ของเดือนนั้นแล้ว เลือกวันสิ้นเดือน แล้วกด <b class=\"btn\">ปิดงวด<\/b><\/li>\n          <li>เอกสารที่ลงวันที่ในงวดที่ปิดแล้ว จะบันทึก แก้ หรือยกเลิกไม่ได้ ระบบแจ้งเหตุผลให้<\/li>\n          <li>สิ้นปีกด <b class=\"btn\">ปิดบัญชีสิ้นปี<\/b> ปุ่มบอกกำไรหรือขาดทุนของปี ระบบโอนรายได้และค่าใช้จ่ายเข้ากำไรสะสม และปิดงวดถึง 31 ธ.ค.<\/li>\n          <li>ต้องแก้งวดที่ปิดแล้ว: เจ้าของหรือผู้ดูแลระบบใส่ <b>เหตุผลที่เปิดงวด<\/b> แล้วกด <b class=\"btn\">เปิดงวดล่าสุด<\/b> ถ้าเป็นการปิดสิ้นปี รายการปิดบัญชีจะถูกยกเลิกด้วย ดูทุกครั้งที่ปิด/เปิดได้ที่ ประวัติการปิดงวด<\/li>\n        <\/ul>\n      <\/div>","เคลื่อนไหวของ":"<div class=\"card\">\n        <h3>เคลื่อนไหวของ<\/h3>\n        <ul class=\"do\">\n          <li><b>บันทึกการใช้วัสดุ<\/b>: เลือกโครงการ ติ๊กวัสดุ ใส่จำนวนและพื้นที่ แล้วกด <b class=\"btn\">บันทึกการใช้วัสดุ<\/b><\/li>\n          <li><b class=\"btn\">สร้างรายการ<\/b>: รับเข้า / จ่ายออก / โอนย้าย / ยืม จ่ายออกต้องเลือกประเภท เช่น เบิกใช้หน้างาน คืนผู้ขาย ชำรุด/สูญหาย<\/li>\n          <li>สร้างรหัสสินค้าใหม่ได้เฉพาะจัดซื้อ หัวหน้าจัดซื้อ เจ้าของ และแอดมิน<\/li>\n        <\/ul>\n      <\/div>","นับและปรับยอด":"<div class=\"card\">\n        <h3>นับและปรับยอด<\/h3>\n        <ul class=\"do\">\n          <li><b>นับสต็อก<\/b>: ใส่จำนวนนับจริง แล้ว <b class=\"btn\">บันทึกผลนับสต็อก<\/b> ยอดยังไม่เปลี่ยน<\/li>\n          <li>ถ้านับแล้วไม่ตรง ไปที่ <b>ปรับปรุงยอดสต็อก<\/b> › <b class=\"btn\">สร้างใบปรับปรุงยอด<\/b> › <b class=\"btn\">ส่งคำขอปรับยอด<\/b> พร้อมเหตุผล ใบนี้ได้เลข <b>AJ<\/b><\/li>\n          <li>หัวหน้าจัดซื้อ ผจก.ทั่วไป เจ้าของ หรือแอดมินอนุมัติ ยอดจึงเปลี่ยน และระบบลงบัญชีส่วนต่างมูลค่าสต็อกให้<\/li>\n        <\/ul>\n      <\/div>","วัสดุใกล้หมด":"<div class=\"card\">\n        <h3>วัสดุใกล้หมด<\/h3>\n        <ul class=\"do\">\n          <li>แสดงเฉพาะวัสดุที่คงเหลือไม่เกินจุดสั่งซื้อ ถ้าไม่มีของใกล้หมดจะขึ้นว่า “ไม่มีวัสดุใกล้หมด” ตั้งค่าได้ที่ <b class=\"btn\">ตั้งค่าจุดสั่งซื้อ<\/b> (ใส่ 0 = ไม่เตือน)<\/li>\n          <li>ของใกล้หมดให้เปิดใบขอซื้อและใบสั่งซื้อตามปกติ เมื่อ <b>รับสินค้าจาก PO<\/b> ยอดคงเหลือจะเพิ่มเองและรายการจะหายจากหน้านี้<\/li>\n          <li>Dashboard มีตารางสินค้าต่ำกว่าจุดสั่งซื้อ พร้อมลิงก์ CSV<\/li>\n        <\/ul>\n      <\/div>","รายการเคลื่อนไหวสต็อก":"<div class=\"card\">\n      <h3>รายการเคลื่อนไหวสต็อก<\/h3>\n      <div class=\"meta\"><span class=\"where\" style=\"margin-left:0\">สต็อก › รายการเคลื่อนไหวล่าสุด<\/span><\/div>\n      <ul class=\"do\">\n        <li>เปิดหน้ามาจะเห็นการรับเข้า จ่ายออก โอนย้าย และปรับยอดของ <b>ทุกวัสดุ<\/b> ใน <b>ทุกคลัง / ทุกโครงการ<\/b> ย้อนหลัง 13 เดือน เรียงจากล่าสุด แต่ละบรรทัดบอก ต้นทาง ปลายทาง จำนวน <b>คงเหลือ<\/b> (ยอดของวัสดุนั้นหลังรายการนั้น) มูลค่า และผู้ทำรายการ<\/li>\n        <li>ดูเฉพาะวัสดุเดียว: คลิกช่อง <b>ทุกวัสดุ<\/b> ด้านบน พิมพ์ชื่อหรือรหัส เช่น “เหล็ก” หรือ “MAT-6911” แล้วเลือก หรือคลิกชื่อวัสดุในตารางก็ได้ ตอนดูวัสดุเดียวจะมีแถว <b>ยอดยกมา<\/b> ท้ายตาราง<\/li>\n        <li>ดูเฉพาะโครงการหรือคลัง: คลิกช่อง <b>ทุกคลัง / ทุกโครงการ<\/b> แล้วพิมพ์ชื่อหรือรหัสโครงการ เลือก <b>ทุกคลัง / ทุกโครงการ<\/b> อีกครั้งเพื่อกลับไปดูทั้งหมด<\/li>\n        <li>ช่องค้นหาด้านบนกรองตามชื่อวัสดุ SKU เลขที่เอกสาร ต้นทาง ปลายทาง หรือผู้ทำรายการ ขณะพิมพ์ ช่อง <b>ประเภท<\/b> เลือกดูเฉพาะรับเข้า จ่ายออก โอนย้าย ฯลฯ ตัวเลขมุมขวาบอกว่าพบกี่รายการ<\/li>\n        <li>แสดงหน้าละ 50 รายการ กด <b class=\"btn\">ก่อนหน้า<\/b> / <b class=\"btn\">ถัดไป<\/b> ด้านล่างเพื่อเปลี่ยนหน้า กด <b class=\"btn\">พิมพ์<\/b> เพื่อพิมพ์หน้าที่เห็น<\/li>\n        <li>ตอนเลือกทุกคลัง การโอนย้ายระหว่างคลังแสดงเป็น <b>⇄ จำนวน<\/b> สีเทา เพราะยอดรวมของบริษัทไม่เปลี่ยน ถ้าเลือกคลังหรือโครงการ จะเห็นเป็น + หรือ − ของคลังนั้น<\/li>\n        <li>เจ้าของและแอดมินติ๊กเลือกรายการแล้วกด <b class=\"btn\">ลบข้อมูล<\/b> ได้ (เฉพาะรายการที่บันทึกเองหรือยอดยกมา)<\/li>\n      <\/ul>\n    <\/div>","สมุดคุมสต็อก (Stock Card)":"<div class=\"card\">\n      <h3>สมุดคุมสต็อก (Stock Card)<\/h3>\n      <div class=\"meta\"><span class=\"where\" style=\"margin-left:0\">สต็อก › สมุดคุมสต็อก (Stock Card)<\/span><\/div>\n      <ul class=\"do\">\n        <li>เลือกสินค้า คลัง (คลังกลาง คลังของแต่ละโครงการ หรือ <b>ทุกคลังรวมกัน<\/b>) และช่วงวันที่ แล้วกด <b class=\"btn\">แสดง<\/b><\/li>\n        <li>แต่ละบรรทัดบอกวันที่ เลขที่ / อ้างอิง ประเภท (รับเข้า เบิก/จ่ายออก โอนย้าย รับคืน ปรับปรุง (AJ)) จำนวนรับเข้า จ่ายออก คงเหลือ ทุน/หน่วย และมูลค่าคงเหลือ<\/li>\n        <li>ต้นทุนเฉลี่ยคำนวณใหม่ทุกครั้งที่รับของ และใช้เป็นต้นทุนขายตอนออกใบกำกับภาษี กด <b class=\"btn\">Export CSV<\/b> เพื่อส่งให้บัญชี<\/li>\n      <\/ul>\n    <\/div>","ตรวจเช็คทรัพย์สิน":"<div class=\"card\">\n      <h3>ตรวจเช็คทรัพย์สิน<\/h3>\n      <div class=\"meta\"><span class=\"who fin\">การเงิน<\/span><span class=\"who pur\">หัวหน้าจัดซื้อ<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\" style=\"margin-left:0\">ดูแลทะเบียน · หน้างานตรวจของในโครงการตัวเอง<\/span><\/div>\n      <div class=\"statusline\"><b class=\"btn\">ตรวจเช็ค<\/b> หรือสแกน QR<span class=\"arr\">›<\/span>ถ่ายรูป<span class=\"arr\">›<\/span>ยืนยันตำแหน่งบนแผนที่<span class=\"arr\">›<\/span>ยืนยันสถานะ <span class=\"st ok\">Active<\/span> หรือ <b class=\"btn\">พบปัญหา<\/b> (ชำรุด / ส่งซ่อม / สูญหาย)<\/div>\n      <p class=\"note\">ทะเบียน: <b class=\"btn\">เพิ่มทรัพย์สิน<\/b>, นำเข้าจาก Excel, พิมพ์ QR, ส่งออกค่าเสื่อม ครบรอบตรวจทุก 90 วันเป็นค่าเริ่มต้น และเตือนล่วงหน้า 7 วัน<\/p>\n    <\/div>","ทะเบียนรถ":"<div class=\"card\">\n        <h3>ทะเบียนรถ<\/h3>\n        <div class=\"meta\"><span class=\"who exec\">ผจก.ทั่วไป<\/span><span class=\"who pur\">หัวหน้าจัดซื้อ<\/span><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><\/div>\n        <p class=\"note\">รถมาจากทะเบียนทรัพย์สินหมวด ยานพาหนะ ตั้งทะเบียน เลขไมล์ รอบเข้าศูนย์ (กม.) และเปิด/ปิดให้จอง<\/p>\n      <\/div>","ขอใช้รถ → อนุมัติ → รับรถ → คืนรถ":"<div class=\"card\">\n        <h3>ขอใช้รถ → อนุมัติ → รับรถ → คืนรถ<\/h3>\n        <div class=\"meta\"><span class=\"who admin\">ทุกคนขอได้<\/span><span class=\"who exec\">สำนักงานอนุมัติ<\/span><\/div>\n        <ul class=\"do\">\n          <li>กด <b class=\"btn\">ขอใช้รถ<\/b> เลือกรถ (เห็นคิวจอง) เวลา ผู้ขับ โครงการ วัตถุประสงค์ ปลายทาง แล้ว <b class=\"btn\">ส่งคำขอใช้รถ<\/b> จองซ้อนเวลาไม่ได้<\/li>\n          <li>ผจก.ทั่วไป หัวหน้าจัดซื้อ เจ้าของ หรือแอดมิน กด <b class=\"btn\">อนุมัติ<\/b> / <b class=\"btn\">ไม่อนุมัติ<\/b><\/li>\n          <li>คนขับรับรถ: ใส่เลขไมล์ ระดับน้ำมัน รูป 1–6 รูป แล้ว <b class=\"btn\">ยืนยันรับรถ<\/b> ระหว่างขับกด <b class=\"btn\">เริ่มส่งตำแหน่ง<\/b> (ส่งทุก 15 วินาที ต้องเปิดหน้านี้ค้างไว้)<\/li>\n          <li>คืนรถ: เลขไมล์ น้ำมัน ความเสียหาย รูป แล้ว <b class=\"btn\">ยืนยันคืนรถ<\/b> ค่าน้ำมัน ทางด่วน ที่จอด กด <b class=\"btn\">ขอเบิกค่าใช้จ่าย<\/b> ระบบสร้างเงินทดรองให้<\/li>\n        <\/ul>\n        <div class=\"statusline\"><span class=\"st wait\">รออนุมัติ<\/span><span class=\"arr\">›<\/span><span class=\"st\">อนุมัติแล้ว รอรับรถ<\/span><span class=\"arr\">›<\/span><span class=\"st wait\">กำลังใช้งาน<\/span><span class=\"arr\">›<\/span><span class=\"st ok\">คืนรถแล้ว<\/span><\/div>\n      <\/div>","ติดตามรถ Realtime":"<div class=\"card\">\n        <h3>ติดตามรถ Realtime<\/h3>\n        <p class=\"note\">แผนที่อัปเดตทุก 10 วินาที: กำลังวิ่ง / จอดอยู่ / สัญญาณขาด (ไม่มีตำแหน่งเกิน 3 นาที) / ยังไม่ส่งตำแหน่ง การเงินดูได้ด้วยเพื่อตรวจค่าใช้จ่าย<\/p>\n      <\/div>","รายงานการใช้รถ":"<div class=\"card\">\n        <h3>รายงานการใช้รถ<\/h3>\n        <p class=\"note\">สรุปตามรถ คนขับ และโครงการ รถที่คืนเกินกำหนด รถที่ถึงรอบเข้าศูนย์ และความเสียหายที่แจ้ง<\/p>\n      <\/div>","ผู้ใช้งาน":"<div class=\"card\">\n        <h3>ผู้ใช้งาน<\/h3>\n        <div class=\"meta\"><span class=\"who admin\">แอดมินเท่านั้น<\/span><\/div>\n        <ul class=\"do\">\n          <li><b class=\"btn\">สร้างผู้ใช้งาน<\/b>: ชื่อ อีเมล รหัสผ่านเริ่มต้น<\/li>\n          <li><b class=\"btn\">ตั้งค่าตามตำแหน่ง<\/b> ติ๊กตำแหน่งและเมนูให้ในคลิกเดียว แล้วปรับเพิ่มได้<\/li>\n          <li>ติ๊ก <b>โครงการที่สังกัด<\/b> ให้คนหน้างาน และติ๊กออกจาก <b>เมนูที่ใช้งานได้<\/b> เพื่อซ่อนเมนู<\/li>\n        <\/ul>\n      <\/div>","ตั้งค่าบริษัท":"<div class=\"card\">\n        <h3>ตั้งค่าบริษัท<\/h3>\n        <div class=\"meta\"><span class=\"who admin\">แอดมิน<\/span><span class=\"who exec\">เจ้าของ<\/span><\/div>\n        <ul class=\"do\">\n          <li>ชื่อบริษัท ที่อยู่ เลขผู้เสียภาษี สาขา<\/li>\n          <li><b>วงเงิน PO<\/b>: ยอดรวม VAT ต่ำกว่านี้ หัวหน้าจัดซื้อหรือผจก.ทั่วไปอนุมัติได้ ตั้งแต่วงเงินขึ้นไปเจ้าของเท่านั้น<\/li>\n          <li>กด <b class=\"btn\">บันทึกการตั้งค่า<\/b><\/li>\n        <\/ul>\n      <\/div>","เลขที่เอกสาร":"<div class=\"card\">\n        <h3>เลขที่เอกสาร<\/h3>\n        <div class=\"meta\"><span class=\"who admin\">แอดมิน<\/span><span class=\"who exec\">เจ้าของ<\/span><\/div>\n        <ul class=\"do\">\n          <li>ตั้งเลขถัดไปของเดือนนี้ แยกตามประเภทเอกสาร (PR นับแยกรายโครงการ)<\/li>\n          <li>แก้เลขที่ออกไปแล้ว: เลขเดิม เลขใหม่ เหตุผล แล้วกด <b class=\"btn\">เปลี่ยนเลข<\/b> ระบบเก็บประวัติไว้ และไม่ออกเลขซ้ำ<\/li>\n        <\/ul>\n      <\/div>","ล้างข้อมูลทั้งระบบ":"<div class=\"card\">\n        <h3>ล้างข้อมูลทั้งระบบ<\/h3>\n        <div class=\"meta\"><span class=\"who exec\">เจ้าของ<\/span><span class=\"who admin\">แอดมิน<\/span><span class=\"where\">ตั้งค่า › ตั้งค่าบริษัท › ล้างข้อมูลทั้งระบบ →<\/span><\/div>\n        <ul class=\"do\">\n          <li>ใช้ล้างข้อมูลทดสอบก่อนเริ่มใช้งานจริง: ลบเอกสารทุกเมนู และเลขที่เอกสารทุกประเภทกลับไปเริ่มที่ 0<\/li>\n          <li><b>ไม่ถูกลบ<\/b>: BOQ ทุกฉบับ (รวมโครงการ แผนงาน และงวดงาน) ซัพพลายเออร์ ทะเบียนสินค้า (ยอดคงเหลือกลับเป็น 0) ผู้ใช้งาน สิทธิ์ และลายเซ็น<\/li>\n          <li>หน้านี้แสดงจำนวนที่จะถูกลบก่อน พิมพ์ <b>\"ล้างข้อมูลทั้งระบบ\"<\/b> ให้ตรง แล้วกด <b class=\"btn\">ล้างข้อมูลทั้งระบบ<\/b> <span class=\"st wait\">ลบถาวร กู้คืนไม่ได้<\/span> ควรสำรองฐานข้อมูลก่อนเสมอ<\/li>\n        <\/ul>\n      <\/div>"};

    if (anim) { gsap.fromTo('#scrim', { opacity: 0 }, { opacity: 1, duration: .3 }); gsap.fromTo(panel, { yPercent: 100 }, { yPercent: 0, duration: .55, ease: 'expo.out' }); }
    var x = panel.querySelector('.x'); if (x) x.focus();
  }
  function closeSheet() {
    var done = function () { sheet.hidden = true; document.documentElement.style.overflow = ''; if (lastFocus) lastFocus.focus(); };
    if (anim) { gsap.to('#scrim', { opacity: 0, duration: .25 }); gsap.to(panel, { yPercent: 100, duration: .35, ease: 'power2.in', onComplete: done }); } else done();
  }
  $('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (sheet.hidden) return;
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'ArrowRight' && idx < line.steps.length - 1) fill(idx + 1);
    if (e.key === 'ArrowLeft' && idx > 0) fill(idx - 1);
  });

  // hero + bento entrances
  if (anim) {
    gsap.from('.hx', { y: 40, opacity: 0, duration: 1.1, stagger: .12, ease: 'power3.out' });
    gsap.utils.toArray('.bx').forEach(function (el, i) {
      gsap.from(el, { y: 60, opacity: 0, duration: .9, ease: 'power3.out', delay: (i % 2) * .08, scrollTrigger: { trigger: el, start: 'top 90%' } });
    });
    gsap.to('.hero .inner', { yPercent: 18, opacity: .2, ease: 'none', scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true } });
  }

  window.addEventListener('resize', function () { movePill(true); });
  try { role = localStorage.getItem('ktec-pipeline-role') || null; } catch (e) {}
  if (role && !ROLE_LABEL[role]) role = null;
  var saved = null; try { saved = localStorage.getItem('ktec-pipeline-line'); } catch (e) {}
  setLine(LINES.filter(function (L) { return L.id === saved; })[0] || LINES[0], false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { movePill(true); if (hasG) ScrollTrigger.refresh(); });
})();
</script>
